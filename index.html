<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F1F3F6">
  <meta name="description" content="급여일 기준 예산 주기 관리 PWA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Payroll M">
  <title>Payroll Management</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="shortcut icon" href="icons/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* 디자인 시스템 추가 규칙 (기존 style.css 미수정) */
    .sheet{display:none; z-index:31}
    .sheet.on{display:block}
    .ib{border:1px solid var(--line);transition:transform .12s,background .15s,color .15s,box-shadow .15s}
    .ib:hover{background:var(--soft);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
    .ib:active{transform:scale(.9)}
    .ib svg{display:block}
    select{width:100%;min-height:50px;border:0;border-radius:14px;padding:0 16px;
      background:var(--soft);color:var(--ink);font:inherit}
    select:focus{outline:0;box-shadow:0 0 0 2px var(--brand)}
    /* 주기 네비게이션 버튼 - 깔끔하게 arrow만 */
    .mnav .ib{border:none;background:transparent;box-shadow:none;padding:4px}
    .mnav .ib:hover{background:transparent;color:inherit;box-shadow:none}
    .mnav .ib:active{transform:none}
    .mnav .ib:focus{outline:none;box-shadow:none}
    .mnav .ib:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:50%}
    .toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);
      background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;
      font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;
      z-index:50;max-width:86%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    /* 로딩 스크린 */
    .loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;transition:opacity .4s ease,visibility .4s ease}
    .loading-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
    .loading-content{text-align:center;animation:fadeIn .4s ease}
    .loading-icon{margin-bottom:20px}
    .loading-icon svg{width:64px;height:64px}
    .loading-text{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.03em;margin:0 0 6px}
    .loading-subtext{font-size:14px;color:var(--muted);margin:0}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @media(prefers-reduced-motion:reduce){.loading-screen{transition:none}.loading-content{animation:none}}
  </style>
</head>
<body>
  <!-- 로딩 스크린 (즉시 표시, JS에서 제거) -->
  <div id="loadingScreen" class="loading-screen" aria-hidden="true">
    <div class="loading-content">
      <div class="loading-icon" aria-hidden="true">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="28" stroke="var(--brand)" stroke-width="4" stroke-linecap="round" stroke-dasharray="175.9" stroke-dashoffset="50">
            <animate attributeName="stroke-dashoffset" from="175.9" to="0" dur="1.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1" keyTimes="0;1"/>
            <animate attributeName="stroke-dasharray" from="0, 175.9" to="100, 175.9" dur="1.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1" keyTimes="0;1"/>
          </circle>
        </svg>
      </div>
      <p class="loading-text">Payroll Management</p>
      <p class="loading-subtext">데이터를 불러오는 중...</p>
    </div>
  </div>

  <div class="app" id="app" style="opacity: 0; visibility: hidden;">
    <!-- 상단: 주기 네비게이션 -->
    <header class="top">
      <div class="mnav">
        <button class="ib" id="prevCycle" aria-label="이전 주기">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="mt" id="cycleTitle">1~2월 주기<small id="cycleYear">2026</small></div>
        <button class="ib" id="nextCycle" aria-label="다음 주기">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
    </header>

    <!-- 히어로: 잔액 -->
    <section class="hero">
      <div class="hl">
        <span>남은 예산</span>
        <button class="salary-action" id="addIncomeBtn" aria-label="급여 입력">＋ 급여 입력</button>
      </div>
      <div class="balance-main">
        <div class="big" id="balanceBig">0<small>원</small></div>
      </div>
      <div class="bar" id="progressBar">
        <i class="b1" id="barSpent"></i>
        <i class="b2" id="barToday"></i>
        <i class="d3" id="barRemain"></i>
      </div>
      <div class="lg">
        <div><i class="d3"></i>남은 예산<b id="lgRemain">-</b></div>
        <div><i class="b1"></i>지출<b id="lgSpent">-</b></div>
        <div><i class="b2"></i>급여<b id="lgIncome">-</b></div>
      </div>
    </section>

    <!-- 지출 내역 -->
    <section class="sec">
      <div class="sec-head">
        <h2>지출 내역 <small id="expenseCount">0건</small></h2>
        <button class="link" id="clearBtn">초기화</button>
      </div>
      <div class="day">
        <span id="cycleRange">-</span>
        <span class="due" id="ddayBadge">-</span>
      </div>
      <div class="expense-groups">
        <section class="expense-group">
          <div class="group-head"><h3>고정지출</h3><small id="recurringExpenseCount">0건</small></div>
          <div class="list" id="recurringExpenseList">
            <div class="empty">등록된 고정지출이 없습니다</div>
          </div>
        </section>
        <section class="expense-group">
          <div class="group-head"><h3>일반 지출</h3><small id="regularExpenseCount">0건</small></div>
          <div class="list" id="regularExpenseList">
            <div class="empty">등록된 지출이 없습니다</div>
          </div>
        </section>
      </div>
    </section>

    <!-- FAB -->
    <div class="fab">
      <button class="btn" id="addExpenseBtn">＋ 지출 추가</button>
    </div>
  </div>

  <!-- 오버레이 -->
  <div class="ov" id="overlay"></div>

  <!-- 지출 추가/수정 시트 -->
  <div class="sheet" id="expenseSheet" role="dialog" aria-modal="true">
    <div class="expense-heading">
      <h3 id="expSheetTitle">지출 추가</h3>
      <button type="button" class="sheet-close" id="expClose" aria-label="닫기">&times;</button>
    </div>
    <label class="f"><span>금액</span>
      <div class="amt-box">
        <input type="text" inputmode="numeric" class="amt" id="expAmount" placeholder="0" autocomplete="off">
        <span class="unit">원</span>
      </div>
    </label>
    <label class="f"><span>항목</span>
      <input type="text" id="expName" placeholder="예: 점심, 교통카드" autocomplete="off">
    </label>
    <div class="category-field">
      <span class="field-label" id="categoryLabel">카테고리</span>
      <div class="chips" id="catChips" role="group" aria-labelledby="categoryLabel"></div>
    </div>
    <div class="expense-options">
      <label class="recurring-option" for="expRecurring">
        <input type="checkbox" id="expRecurring">
        <span>고정 지출</span>
      </label>
      <div class="date-option">
        <span class="field-label" id="dateLabel">날짜</span>
        <input type="hidden" id="expDate">
        <button type="button" class="date-trigger" id="expDateTrigger" aria-labelledby="dateLabel expDateText">
          <span id="expDateText"></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg>
        </button>
        <select id="expRecurringDay" aria-labelledby="dateLabel" hidden></select>
      </div>
    </div>
    <p class="recurring-hint" id="expRecurringHint" hidden></p>
    <div class="expense-actions">
      <div class="err" id="expErr" role="alert"></div>
      <button class="btn" id="expSave">지출 추가</button>
      <div class="foot" id="expFoot" style="display:none">
        <button class="btn danger" id="expDelete">삭제</button>
        <button class="btn" id="expUpdate">변경사항 저장</button>
      </div>
    </div>
  </div>

  <div class="calendar-overlay" id="calendarOverlay" hidden>
    <div class="calendar-panel" role="dialog" aria-modal="true" aria-labelledby="calendarTitle">
      <div class="calendar-top">
        <h3 id="calendarTitle">날짜 선택</h3>
        <button type="button" class="sheet-close" id="calendarClose" aria-label="달력 닫기">&times;</button>
      </div>
      <div class="calendar-nav">
        <button type="button" class="calendar-arrow" id="calendarPrev" aria-label="이전 달">&#8249;</button>
        <strong id="calendarMonth"></strong>
        <button type="button" class="calendar-arrow" id="calendarNext" aria-label="다음 달">&#8250;</button>
      </div>
      <div class="calendar-weekdays" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
      <div class="calendar-days" id="calendarDays"></div>
      <button type="button" class="calendar-today" id="calendarToday">오늘로 선택</button>
    </div>
  </div>

  <!-- 급여 입력 시트 -->
  <div class="sheet" id="incomeSheet" role="dialog" aria-modal="true">
    <h3>급여 입력/수정</h3>
    <label class="f"><span class="f-label-row"><span>금액</span><button class="label-reset" id="incReset" style="display:none">초기화</button></span>
      <div class="amt-box">
        <input type="text" inputmode="numeric" class="amt" id="incAmount" placeholder="3000000" autocomplete="off">
        <span class="unit">원</span>
      </div>
    </label>
    <button class="load-prev-salary" id="loadPreviousIncomeSalary">지난달 월급 불러오기</button>
    <div class="f"><span class="field-label">급여일 <small class="muted">(주말·공휴일이면 전 영업일)</small></span>
      <div class="payday-chips" id="payDayChips" role="radiogroup" aria-label="급여일 선택">
        <button type="button" class="chip" data-val="10" role="radio" aria-checked="false">10일</button>
        <button type="button" class="chip" data-val="15" role="radio" aria-checked="false">15일</button>
        <button type="button" class="chip" data-val="20" role="radio" aria-checked="false">20일</button>
        <button type="button" class="chip" data-val="25" role="radio" aria-checked="false">25일</button>
      </div>
    </div>
    <div class="err" id="incErr"></div>
    <button class="btn" id="incSave">저장</button>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
